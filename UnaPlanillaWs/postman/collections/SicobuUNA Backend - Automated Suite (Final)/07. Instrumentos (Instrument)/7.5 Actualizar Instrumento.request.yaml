$kind: http-request
url: "{{baseUrl}}/Instrument/instrument"
method: PUT
headers:
  Content-Type: application/json
  Accept: application/json
  Accept-Language: es
body:
  type: text
  content: |-
    {
      "id": "{{instrumentId}}",
      "pendingAmount": 25000,
      "name": "Escritura de Compraventa Mod",
      "description": "Compraventa lote - abono recibido",
      "type": "Escritura Publica",
      "registered": "F",
      "date": "2026-10-25",
      "ticketNumber": 12345,
      "volume": 10,
      "folio": 20,
      "seat": 30,
      "pendingPayment": "T",
      "observations": "Actualizado con abono",
      "taxable": "T",
      "taxNumber": 7788,
      "realValue": 500000,
      "billedValue": "550000",
      "lawyerId": "{{lawyerId}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("7.5 Actualizar Instrumento - Estado HTTP exitoso (200)", function () {
          pm.response.to.have.status(200);
      });
    language: text/javascript
order: 5000
