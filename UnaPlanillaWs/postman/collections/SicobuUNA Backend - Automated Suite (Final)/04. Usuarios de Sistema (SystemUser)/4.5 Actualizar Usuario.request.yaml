$kind: http-request
url: "{{baseUrl}}/SystemUser/systemUser"
method: PUT
headers:
  Content-Type: application/json
  Accept: application/json
  Accept-Language: es
body:
  type: text
  content: |-
    {
      "id": "{{userId}}",
      "systemName": "cmora{{uniqueSuffix}}",
      "password": "Password123!",
      "admin": "T",
      "systemLanguage": "Spanish",
      "active": "T",
      "passwordChanged": "T",
      "lawyerId": "{{lawyerId}}",
      "picture": [
        1,
        2,
        3,
        4
      ]
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("4.5 Actualizar Usuario - Estado HTTP exitoso (200)", function () {
          pm.response.to.have.status(200);
      });
    language: text/javascript
order: 5000
