$kind: http-request
url: "{{baseUrl}}/LawFirm/Firm"
method: PUT
headers:
  Content-Type: application/json
  Accept: application/json
  Accept-Language: es
body:
  type: text
  content: |-
    {
      "id": "{{firmId}}",
      "name": "Bufete Central UNA Actualizado",
      "phoneNumber": "2222-4444",
      "email": "contacto@bufeteuna.com",
      "address": "Heredia Centro",
      "logo": [
        1,
        2,
        3,
        4
      ],
      "active": true
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("2.3 Actualizar Bufete - Estado HTTP exitoso (200)", function () {
          pm.response.to.have.status(200);
      });
    language: text/javascript
order: 3000
