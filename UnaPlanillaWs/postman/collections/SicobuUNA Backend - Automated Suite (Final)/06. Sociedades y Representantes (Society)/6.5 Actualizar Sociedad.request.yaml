$kind: http-request
url: "{{baseUrl}}/Society/society"
method: PUT
headers:
  Content-Type: application/json
  Accept: application/json
  Accept-Language: es
body:
  type: text
  content: |-
    {
      "id": "{{societyId}}",
      "corporateId": "3-101-99{{uniqueSuffix}}",
      "name": "Inversiones del Valle S.A. Mod",
      "phoneNumber": "2233-9999",
      "address": "Escazu, San Jose",
      "volume": "100",
      "folio": "200",
      "seat": "300",
      "registeredDate": "2026-01-15",
      "stockType": "C",
      "numberOfStockTitles": 1000,
      "stockValue": "100000",
      "active": true,
      "lawFirmId": "{{firmId}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("6.5 Actualizar Sociedad - Estado HTTP exitoso (200)", function () {
          pm.response.to.have.status(200);
      });
    language: text/javascript
order: 5000
