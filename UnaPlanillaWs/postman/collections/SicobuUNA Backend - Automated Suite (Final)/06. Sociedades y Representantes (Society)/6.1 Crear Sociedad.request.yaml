$kind: http-request
url: "{{baseUrl}}/Society/society"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
  Accept-Language: es
body:
  type: text
  content: |-
    {
      "id": 0,
      "corporateId": "3-101-99{{uniqueSuffix}}",
      "name": "Inversiones del Valle S.A.",
      "phoneNumber": "2233-4455",
      "address": "Santa Ana, San Jose",
      "volume": "100",
      "folio": "200",
      "seat": "300",
      "registeredDate": "2026-01-15",
      "stockType": "C",
      "numberOfStockTitles": 1000,
      "stockValue": "100000",
      "active": true,
      "lawFirmId": "{{firmId}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("6.1 Crear Sociedad - Estado HTTP exitoso (200)", function () {
          pm.response.to.have.status(200);
      });

      try {
          var jsonData = pm.response.json();
          var extractedId = jsonData.id || (jsonData.item && jsonData.item.id);
          if (extractedId) {
              pm.collectionVariables.set("societyId", extractedId);
              console.log("Variable societyId guardada:", extractedId);
          }
      } catch (e) {
          console.error("Error al parsear respuesta JSON", e);
      }
    language: text/javascript
order: 1000
