$kind: http-request
url: "{{baseUrl}}/Representative/representative"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
  Accept-Language: es
body:
  type: text
  content: |-
    {
      "id": 0,
      "position": "Presidente",
      "active": "T",
      "societyId": "{{societyId}}",
      "person": {
        "id": 0,
        "name": "Mario",
        "firstLastname": "Gomez",
        "secondLastname": "Castro",
        "identificationType": "Physical Id",
        "legalId": "304560{{uniqueSuffix}}",
        "phoneNumber": "8333-2222",
        "email": "mario.gomez@empresa.com"
      }
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("6.6 Crear Representante - Estado HTTP exitoso (200)", function () {
          pm.response.to.have.status(200);
      });

      try {
          var jsonData = pm.response.json();
          var extractedId = jsonData.id || (jsonData.item && jsonData.item.id);
          if (extractedId) {
              pm.collectionVariables.set("representativeId", extractedId);
              console.log("Variable representativeId guardada:", extractedId);
          }
          if (jsonData.person && jsonData.person.id) {
              pm.collectionVariables.set("representativePersonId", jsonData.person.id);
              console.log("Variable representativePersonId guardada:", jsonData.person.id);
          }
      } catch (e) {
          console.error("Error al parsear respuesta JSON", e);
      }
    language: text/javascript
order: 6000
