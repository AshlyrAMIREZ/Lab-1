$kind: http-request
url: "{{baseUrl}}/Representative/representative"
method: PUT
headers:
  Content-Type: application/json
  Accept: application/json
  Accept-Language: es
body:
  type: text
  content: |-
    {
      "id": "{{representativeId}}",
      "position": "Apoderado General",
      "active": "T",
      "societyId": "{{societyId}}",
      "person": {
        "id": "{{representativePersonId}}",
        "name": "Mario",
        "firstLastname": "Gomez",
        "secondLastname": "Castro",
        "identificationType": "Physical Id",
        "legalId": "304560{{uniqueSuffix}}",
        "phoneNumber": "8333-5555",
        "email": "mario.gomez@empresa.com"
      }
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("6.9 Actualizar Representante - Estado HTTP exitoso (200)", function () {
          pm.response.to.have.status(200);
      });
    language: text/javascript
order: 9000
