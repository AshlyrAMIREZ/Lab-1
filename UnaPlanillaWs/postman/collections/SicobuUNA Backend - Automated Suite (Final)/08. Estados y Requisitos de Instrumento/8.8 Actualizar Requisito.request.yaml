$kind: http-request
url: "{{baseUrl}}/InstrumentRequirement/requirement"
method: PUT
headers:
  Content-Type: application/json
  Accept: application/json
  Accept-Language: es
body:
  type: text
  content: |-
    {
      "id": "{{requirementId}}",
      "name": "Plano Entregado",
      "description": "Requisito verificado",
      "state": "C",
      "date": "2026-10-26",
      "indexOfOrder": 1,
      "necesary": "T",
      "active": "T",
      "instrumentId": "{{instrumentId}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("8.8 Actualizar Requisito - Estado HTTP exitoso (200)", function () {
          pm.response.to.have.status(200);
      });
    language: text/javascript
order: 8000
