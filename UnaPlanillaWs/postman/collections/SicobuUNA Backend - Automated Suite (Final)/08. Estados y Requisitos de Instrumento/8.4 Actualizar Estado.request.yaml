$kind: http-request
url: "{{baseUrl}}/InstrumentState/state"
method: PUT
headers:
  Content-Type: application/json
  Accept: application/json
  Accept-Language: es
body:
  type: text
  content: |-
    {
      "id": "{{stateId}}",
      "name": "Revision Registral",
      "description": "Estado actualizado",
      "active": "T",
      "notifyParts": "T",
      "finalState": "F",
      "date": "2026-10-26",
      "stateActive": "T",
      "instrumentId": "{{instrumentId}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("8.4 Actualizar Estado - Estado HTTP exitoso (200)", function () {
          pm.response.to.have.status(200);
      });
    language: text/javascript
order: 4000
