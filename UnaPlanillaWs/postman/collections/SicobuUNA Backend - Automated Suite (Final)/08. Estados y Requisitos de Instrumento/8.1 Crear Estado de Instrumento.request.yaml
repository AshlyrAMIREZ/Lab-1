$kind: http-request
url: "{{baseUrl}}/InstrumentState/state"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
  Accept-Language: es
body:
  type: text
  content: |-
    {
      "id": 0,
      "name": "En Tramite",
      "description": "Documento presentado a registro",
      "active": "T",
      "notifyParts": "T",
      "finalState": "F",
      "date": "2026-10-26",
      "stateActive": "T",
      "instrumentId": "{{instrumentId}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("8.1 Crear Estado de Instrumento - Estado HTTP exitoso (200)", function () {
          pm.response.to.have.status(200);
      });

      try {
          var jsonData = pm.response.json();
          var extractedId = jsonData.id || (jsonData.item && jsonData.item.id);
          if (extractedId) {
              pm.collectionVariables.set("stateId", extractedId);
              console.log("Variable stateId guardada:", extractedId);
          }
      } catch (e) {
          console.error("Error al parsear respuesta JSON", e);
      }
    language: text/javascript
order: 1000
