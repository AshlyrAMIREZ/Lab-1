$kind: http-request
url: "{{baseUrl}}/Authorization/authorization"
method: PUT
headers:
  Content-Type: application/json
  Accept: application/json
  Accept-Language: es
body:
  type: text
  content: |-
    {
      "id": "{{authId}}",
      "viewName": "InstrumentsView",
      "canEnter": "T",
      "canConsult": "T",
      "canCreate": "T",
      "canEdit": "T",
      "canDelete": "T",
      "active": "T",
      "userId": "{{userId}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("11.5 Actualizar Autorización - Estado HTTP exitoso (200)", function () {
          pm.response.to.have.status(200);
      });
    language: text/javascript
order: 5000
