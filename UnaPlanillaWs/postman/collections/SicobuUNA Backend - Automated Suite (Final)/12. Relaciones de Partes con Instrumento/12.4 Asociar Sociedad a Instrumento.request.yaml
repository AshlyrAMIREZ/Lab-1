$kind: http-request
url: "{{baseUrl}}/SocietyOfInstrument/societyOfInstrument"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
  Accept-Language: es
body:
  type: text
  content: |-
    {
      "id": 0,
      "function": "GRANTEE",
      "societyId": "{{societyId}}",
      "instrumentId": "{{instrumentId}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("12.4 Asociar Sociedad a Instrumento - Estado HTTP exitoso (200)", function () {
          pm.response.to.have.status(200);
      });

      try {
          var jsonData = pm.response.json();
          var extractedId = jsonData.id || (jsonData.item && jsonData.item.id);
          if (extractedId) {
              pm.collectionVariables.set("soiId", extractedId);
              console.log("Variable soiId guardada:", extractedId);
          }
      } catch (e) {
          console.error("Error al parsear respuesta JSON", e);
      }
    language: text/javascript
order: 4000
