$kind: http-request
url: "{{baseUrl}}/Event/event"
method: PUT
headers:
  Content-Type: application/json
  Accept: application/json
  Accept-Language: es
body:
  type: text
  content: |-
    {
      "id": "{{eventId}}",
      "description": "Firma completada",
      "date": "2026-10-30",
      "completed": "C",
      "active": "T",
      "instrumentId": "{{instrumentId}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("10.4 Actualizar Evento - Estado HTTP exitoso (200)", function () {
          pm.response.to.have.status(200);
      });
    language: text/javascript
order: 4000
