$kind: http-request
url: "{{baseUrl}}/Payment/payment"
method: PUT
headers:
  Content-Type: application/json
  Accept: application/json
  Accept-Language: es
body:
  type: text
  content: |-
    {
      "id": "{{paymentId}}",
      "description": "Abono corregido con transferencia",
      "date": "2026-10-26",
      "billNumber": 1001,
      "amount": 25000,
      "active": "T",
      "clientId": "{{clientId}}",
      "societyId": 0,
      "instrumentId": "{{instrumentId}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("9.4 Actualizar Pago - Estado HTTP exitoso (200)", function () {
          pm.response.to.have.status(200);
      });
    language: text/javascript
order: 4000
